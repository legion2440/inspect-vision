name: materialize-samples

on:
  push:
    paths:
      - .github/workflows/materialize-samples.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pinned operator samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/samples/demo
          hf='https://huggingface.co/datasets/jiang-cc/MMAD/resolve/e88b7bd615ad582b0a7e8238066a9fb293a072b4/MVTec-AD'
          curl -L --fail --retry 4 "$hf/bottle/test/good/000.png" -o backend/samples/demo/mvtec-bottle-good-000.png
          curl -L --fail --retry 4 "$hf/bottle/test/broken_large/000.png" -o backend/samples/demo/mvtec-bottle-broken-large-000.png
          curl -L --fail --retry 4 "$hf/capsule/test/good/000.png" -o backend/samples/demo/mvtec-capsule-good-000.png
          curl -L --fail --retry 4 "$hf/capsule/test/crack/006.png" -o backend/samples/demo/mvtec-capsule-crack-006.png
          curl -L --fail --retry 4 "$hf/screw/test/good/001.png" -o backend/samples/demo/mvtec-screw-good-001.png
          curl -L --fail --retry 4 "$hf/screw/test/manipulated_front/012.png" -o backend/samples/demo/mvtec-screw-manipulated-front-012.png
          curl -L --fail --retry 4 "$hf/metal_nut/test/good/000.png" -o backend/samples/demo/mvtec-metal-nut-good-000.png
          curl -L --fail --retry 4 "$hf/metal_nut/test/bent/000.png" -o backend/samples/demo/mvtec-metal-nut-bent-000.png
          raw='https://raw.githubusercontent.com/legion2440/inspect-vision/f82fe4645ada00d5b01a16b9a05b2ea36795cce2/backend/samples/showcase'
          curl -L --fail --retry 4 "$raw/steel-good-img4685.jpg" -o backend/samples/demo/steel-good-img4685.jpg
          curl -L --fail --retry 4 "$raw/steel-inclusion-plos-fig3b.png" -o backend/samples/demo/steel-inclusion-plos-fig3b.png
          curl -L --fail --retry 4 "$raw/steel-scratch-img2113.jpg" -o backend/samples/demo/steel-scratch-img2113.jpg
          curl -L --fail --retry 4 "$raw/concrete-cr01-pavement-transverse.jpg" -o backend/samples/demo/concrete-cr01-pavement-transverse.jpg
          curl -L --fail --retry 4 "$raw/concrete-cr26-wall-longitudinal.jpg" -o backend/samples/demo/concrete-cr26-wall-longitudinal.jpg
          curl -L --fail --retry 4 "$raw/concrete-cr43-pavement-diagonal.jpg" -o backend/samples/demo/concrete-cr43-pavement-diagonal.jpg
          test "$(wc -c < backend/samples/demo/mvtec-screw-good-001.png)" -eq 393132
          printf '%s  %s\n' '983a27fcea10ce8eafeebac3db0899e5fb6ad84338a6cabc5746ee96d2865daa' 'backend/samples/demo/mvtec-screw-good-001.png' | sha256sum -c -
      - name: Commit materialized assets and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'inspect-vision materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-samples.yml
          git add backend/samples/demo
          git commit -m 'fix(samples): materialize operator demo images'
          git push
