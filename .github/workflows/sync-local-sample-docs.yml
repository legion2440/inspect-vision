name: sync-local-sample-docs

on:
  push:
    paths:
      - .github/workflows/sync-local-sample-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize sample documentation and metadata
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/sync_samples.py
          python /tmp/sync_samples.py
          python -m json.tool module-map.json >/dev/null
          python -m json.tool docs/project-status.json >/dev/null
          python scripts/validate_structure.py
      - name: Commit docs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'inspect-vision sample docs'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sync-local-sample-docs.yml
          git add -A
          git commit -m 'docs(samples): align single local demo corpus'
          git push
