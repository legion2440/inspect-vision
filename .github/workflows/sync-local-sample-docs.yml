name: sync-local-sample-docs

on:
  push:
    paths:
      - .github/workflows/sync-local-sample-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize sample documentation and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_section(text: str, start: str, end: str, body: str) -> str:
              pattern = re.compile(re.escape(start) + r'.*?(?=' + re.escape(end) + r')', re.S)
              replacement = start + '\n\n' + body.rstrip() + '\n\n'
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not replace section {start!r}')
              return updated

          readme_samples = '''The Samples page contains the same fourteen images committed in `backend/samples/demo/`. They are both the operator sample catalog and the project demo-image set used for acceptance; there is no second demo corpus.

| Group | Local samples | Suggested model |
| --- | --- | --- |
| MVTec AD | Bottle good / broken large; Capsule good / crack; Screw good / manipulated front; Metal nut good / bent | Bayes-PFL general |
| Steel Surface | good surface, inclusion, scratch | Steel Surface specialist |
| Concrete & Structural Cracks | transverse, longitudinal, and diagonal crack examples | Concrete specialist |

The eight MVTec files preserve the previously pinned MMAD revision sources. The six specialist files preserve the previously pinned project-source bytes and dataset attribution. Runtime delivery is now entirely local through `/api/samples/{id}/image`.

Important UI behavior:

- clicking a sample supplies that sample's product/category context;
- clicking a sample **does not change the selected model**;
- `Use suggested model` is the explicit action that switches the model;
- source labels describe dataset metadata and are never presented as model predictions;
- inspecting a sample performs fresh inference through the ordinary `/api/inspect` path and stores the result in normal history.

These fourteen files directly satisfy the assignment requirement for at least ten demo images, including clean and defective examples.'''
          text = read('README.md')
          text = replace_section(text, '## 🖼️ Samples', '## 🔄 Inspection flow', readme_samples)
          text = text.replace('| `GET` | `/api/samples` | list the attributed 14-item operator showcase |', '| `GET` | `/api/samples` | list the fourteen local operator/demo samples |')
          text = text.replace('| `GET` | `/api/samples/{id}/image` | serve one pinned showcase image by catalog ID |', '| `GET` | `/api/samples/{id}/image` | serve one local demo image by catalog ID |')
          text = re.sub(r'\nThe two tests that fetch pinned showcase bytes are opt-in.*?```\n', '\n', text, flags=re.S)
          text = text.replace('- The operator showcase image endpoints use pinned network sources; ordinary repository validation does not fetch them.\n', '- The fourteen operator/demo images are committed locally and require no runtime network access.\n')
          write('README.md', text)

          ru_samples = '''На странице Samples используются те же четырнадцать изображений, которые закоммичены в `backend/samples/demo/`. Это одновременно каталог примеров для оператора и demo-набор проекта для аудита; второго demo-корпуса нет.

| Группа | Локальные примеры | Рекомендуемая модель |
| --- | --- | --- |
| MVTec AD | Bottle good / broken large; Capsule good / crack; Screw good / manipulated front; Metal nut good / bent | Bayes-PFL general |
| Steel Surface | good surface, inclusion, scratch | Steel Surface specialist |
| Concrete & Structural Cracks | transverse, longitudinal и diagonal crack examples | Concrete specialist |

Восемь MVTec-файлов сохраняют прежние источники из зафиксированной MMAD revision. Шесть specialist-файлов сохраняют прежние зафиксированные байты и attribution датасетов. `/api/samples/{id}/image` теперь всегда отдаёт локальный файл.

Важное поведение интерфейса:

- клик по sample подставляет product/category context этого примера;
- клик по sample **не меняет выбранную модель**;
- `Use suggested model` — отдельное явное действие для смены модели;
- source labels описывают metadata датасета и не выдаются за prediction модели;
- инспекция sample выполняет свежий inference через обычный `/api/inspect` и сохраняет результат в history.

Эти четырнадцать файлов напрямую закрывают требование задания `at least 10 demo images`, включая чистые и дефектные примеры.'''
          text = read('README_RU.md')
          text = replace_section(text, '## 🖼️ Примеры', '## 🔄 Поток инспекции', ru_samples)
          text = text.replace('| `GET` | `/api/samples` | список атрибутированного showcase-каталога |', '| `GET` | `/api/samples` | список четырнадцати локальных operator/demo samples |')
          text = text.replace('| `GET` | `/api/samples/{id}/image` | получить одно зафиксированное showcase-изображение |', '| `GET` | `/api/samples/{id}/image` | получить локальное demo-изображение по catalog ID |')
          text = text.replace('- Для загрузки MVTec showcase требуется сеть.\n', '- Все четырнадцать operator/demo images лежат локально и не требуют сети во время работы.\n')
          write('README_RU.md', text)

          text = read('AGENTS.md')
          text = re.sub(
              r'- `backend/routes/sample_catalog\.py` defines the operator-facing Samples catalog:.*?verification scripts\.\n',
              '- `backend/routes/sample_catalog.py` defines the single fourteen-image operator/demo corpus: eight MVTec Bayes-PFL examples plus three steel and three concrete specialist examples. The exact same files live in `backend/samples/demo/`, are served locally by `/api/samples`, and satisfy the demo-image acceptance requirement. There is no second operator/demo corpus.\n- Runtime qualification inputs remain separate verification inputs and may use pinned remote sources through verification scripts.\n',
              text,
              flags=re.S,
          )
          text = text.replace('make probe-samples\n', '')
          text = text.replace('.venv/Scripts/python.exe scripts/probe_demo_samples.py\n', '')
          text = re.sub(r'Demo images are an attributed.*?(?=GNU Make)', 'The fourteen local files in `backend/samples/demo/` are the same images exposed by `/api/samples`; `scripts/validate_demo_samples.py` validates this single corpus. Runtime qualification uses separate verification inputs.\n', text, flags=re.S)
          write('AGENTS.md', text)

          text = read('ARCHITECTURE.md')
          text = text.replace('local demo sample\ncatalog', 'local fourteen-image sample/demo\ncatalog')
          text = text.replace('Samples["Tracked local VisA demo corpus"]', 'Samples["14 local operator/demo images"]')
          text = re.sub(r'- The Samples API is backed by .*?network dependency\.\n', '- The Samples API exposes the fourteen records in `backend/routes/sample_catalog.py` and serves the matching files from `backend/samples/demo/`. These are the project demo images as well as the operator Samples catalog, so image delivery has no runtime network dependency and there is no second demo corpus.\n', text, flags=re.S)
          text = text.replace("The operator's\ntracked VisA demo corpus is a UI/demo asset and is not used as Bayes-PFL\nqualification evidence.", 'The local operator/demo sample corpus is not used as Bayes-PFL runtime qualification evidence.')
          text = text.replace('Runtime qualification sources are separate from the operator demo corpus;\n  model probes may use pinned remote sources while `/api/samples` stays local.', 'Runtime qualification sources are separate verification inputs; model probes may use pinned remote sources while `/api/samples` stays local.')
          write('ARCHITECTURE.md', text)

          api_samples = '''Returns `notice`, dataset attribution metadata, and the fourteen records from the single local operator/demo corpus. The catalog contains eight MVTec Bayes-PFL examples (Bottle, Capsule, Screw, and Metal nut good/bad pairs), three steel examples, and three concrete/crack examples.

Each sample includes its stable ID, product/category context, source labels, recommended model, filename/media type, and same-origin `imageUrl`. Source labels describe dataset metadata, not model predictions. The frontend may pass a sample's `productName` to a guided model, but opening or inspecting a sample never changes the selected model automatically.

### `GET /api/samples/{id}/image`

Serves the matching committed file from `backend/samples/demo/`. Request input is only the known sample ID; filesystem paths and arbitrary URLs are never accepted. Unknown IDs return HTTP 404. The endpoint has no runtime network dependency.

The same fourteen files are the repository demo images and directly satisfy the `at least 10 demo images` acceptance requirement.'''
          text = read('docs/api-contract.md')
          text = replace_section(text, '### `GET /api/samples`', '### `GET /api/export`', api_samples)
          write('docs/api-contract.md', text)

          Path('backend/samples/README.md').write_text('''# Samples\n\n`backend/samples/demo/` is the single operator/demo image corpus. It contains fourteen committed images: eight MVTec Bayes-PFL examples (Bottle, Capsule, Screw, Metal nut), three steel examples, and three concrete/crack examples.\n\n`backend/routes/sample_catalog.py` supplies their IDs, labels, attribution, product context, and recommended models. `/api/samples` exposes the catalog and `/api/samples/{id}/image` serves those same local files. No second demo set or runtime network fetch is used.\n\nThese fourteen images directly satisfy the assignment requirement for at least ten demo images and include clean and defective examples. Validate them with:\n\n```bash\npython scripts/validate_demo_samples.py\n```\n\n`model-probe-samples.json` is separate runtime-verification input metadata; it is not another operator/demo corpus.\n''', encoding='utf-8', newline='\n')

          text = read('backend/routes/README.md')
          text = re.sub(r'- `GET /api/samples`.*?image delivery;', '- `GET /api/samples` and `GET /api/samples/{id}/image`: metadata and local delivery for the fourteen committed operator/demo images;', text, flags=re.S)
          text = text.replace('Demo sample\ninspection', 'Sample\ninspection')
          text = re.sub(r'\nThe twelve VisA files.*?catalog\.\n', '\nThe fourteen files in `backend/samples/demo/` are the operator sample catalog and the project demo-image set.\n', text, flags=re.S)
          write('backend/routes/README.md', text)

          text = read('frontend/README.md')
          text = text.replace('Twelve tracked local VisA demo images with explicit model selection', 'Fourteen local operator/demo images with explicit model selection')
          text = re.sub(r'The Samples page is backed by .*?network\ndependency\.\n', 'The Samples page is backed by the same fourteen files committed in `backend/samples/demo/`: eight MVTec Bayes examples plus three steel and three concrete specialist examples. A card supplies its product/category context but keeps the current model. Source labels are dataset metadata, not predictions. Images are served locally by catalog ID, so browsing the page has no network dependency.\n', text, flags=re.S)
          text = text.replace('tracked local demo metadata', 'local operator/demo metadata')
          text = text.replace('local demo image by manifest ID', 'local demo image by catalog ID')
          write('frontend/README.md', text)

          status_path = Path('docs/project-status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['recorded_at'] = '2026-08-14'
          status['verified'] = [item for item in status.get('verified', []) if not any(term in item.lower() for term in ('visa images', 'visa files', 'network-backed showcase', 'operator samples page is backed'))]
          local_claim = 'the operator Samples page and the demo-image acceptance set are the same fourteen committed files: eight MVTec Bayes examples plus three steel and three concrete specialist examples'
          if local_claim not in status['verified']:
              status['verified'].append(local_claim)
          status['known_limitations'] = [item for item in status.get('known_limitations', []) if item.get('id') != 'operator-showcase-network-source']
          for item in status['known_limitations']:
              if item.get('id') == 'repository-validation-pending':
                  item['detail'] = 'The current local sample/demo consolidation requires canonical repository validation on the current source.'
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          text = read('docs/verification.md')
          text = re.sub(r'^\| At least 10 demo images \|.*$', '| At least 10 demo images | PASS | The same fourteen local files shown on `/samples` are committed in `backend/samples/demo/`; the set includes clean and defective cases across Bayes, steel, and concrete examples | `python scripts/validate_demo_samples.py`; API/frontend tests |', text, flags=re.M)
          text = re.sub(r'^\| Operator demo catalog \|.*$', '| Operator demo catalog | PASS | `/api/samples` exposes those same fourteen committed demo files by stable catalog ID; there is no second demo set and no runtime image network fetch | API/frontend tests; `python scripts/validate_demo_samples.py` |', text, flags=re.M)
          text = text.replace('local demo-catalog consolidation', 'local sample/demo consolidation')
          text = re.sub(r'The local operator demo corpus is independent of\nthat qualification bundle\.', 'The local operator/demo corpus is independent of that qualification bundle.', text)
          write('docs/verification.md', text)

          path = Path('module-map.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for module in data['modules']:
              if module['id'] == 'backend-api':
                  owned = module.setdefault('additional_owned_paths', [])
                  if 'backend/samples/demo' not in owned:
                      owned.append('backend/samples/demo')
                  module['description'] = 'Owns FastAPI composition, HTTP validation, endpoint serialization, CORS, error mapping, and local operator/demo sample delivery.'
              if module['id'] == 'verification-evidence':
                  module['entrypoints'] = [entry for entry in module.get('entrypoints', []) if entry.get('path') not in {'scripts/prepare_demo_samples.py', 'scripts/probe_demo_samples.py'}]
                  module['docs'] = [entry for entry in module.get('docs', []) if entry.get('path') != 'backend/samples/VISA-NOTICE.md']
                  module['generated_artifacts'] = [entry for entry in module.get('generated_artifacts', []) if entry.get('path') != 'docs/evidence/demo-samples/demo-samples-acceptance.json']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          forbidden = ('demo-samples.json', 'VISA-NOTICE.md', 'probe_demo_samples.py', 'prepare_demo_samples.py', 'twelve tracked VisA', 'twelve-image VisA', 'separate VisA audit')
          scan = [Path('README.md'), Path('README_RU.md'), Path('AGENTS.md'), Path('ARCHITECTURE.md'), Path('docs/api-contract.md'), Path('docs/verification.md'), Path('docs/project-status.json'), Path('frontend/README.md'), Path('backend/routes/README.md'), Path('backend/samples/README.md'), Path('module-map.json')]
          hits = []
          for path in scan:
              content = path.read_text(encoding='utf-8')
              for term in forbidden:
                  if term in content:
                      hits.append(f'{path}: {term}')
          if hits:
              raise SystemExit('Stale sample references remain:\n' + '\n'.join(hits))
          PY

          python -m json.tool module-map.json >/dev/null
          python -m json.tool docs/project-status.json >/dev/null

      - name: Commit docs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'inspect-vision sample docs'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sync-local-sample-docs.yml
          git add -A
          git commit -m 'docs(samples): align single local demo corpus'
          git push
