name: sync-local-sample-docs

on:
  push:
    paths:
      - .github/workflows/sync-local-sample-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize sample documentation and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          verification_path = Path('docs/verification.md')
          verification = verification_path.read_text(encoding='utf-8')
          verification = re.sub(r'^\| Operator sample byte retrieval \|.*\n', '', verification, flags=re.M)
          verification = re.sub(r'\nThe operator Samples catalog and the twelve-image VisA demo/evidence corpus are intentionally separate\..*$', '\n', verification, flags=re.S)
          verification_path.write_text(verification, encoding='utf-8', newline='\n')

          status_path = Path('docs/project-status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['verified'] = [item for item in status.get('verified', []) if 'INSPECT_VISION_RUN_NETWORK_TESTS' not in item]
          status['known_limitations'] = [item for item in status.get('known_limitations', []) if item.get('id') != 'operator-showcase-network-source']
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          map_path = Path('module-map.json')
          module_map = json.loads(map_path.read_text(encoding='utf-8'))
          for module in module_map.get('modules', []):
              module['additional_owned_paths'] = [path for path in module.get('additional_owned_paths', []) if path != 'backend/samples/demo-samples.json']
              module['owned_configuration'] = [entry for entry in module.get('owned_configuration', []) if entry.get('path') != 'backend/samples/demo-samples.json']
          map_path.write_text(json.dumps(module_map, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/_sync_sample_docs.py
          python -m json.tool module-map.json >/dev/null
          python -m json.tool docs/project-status.json >/dev/null
          python scripts/validate_structure.py
      - name: Commit docs and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'inspect-vision sample docs'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sync-local-sample-docs.yml scripts/_sync_sample_docs.py
          git add -A
          git commit -m 'docs(samples): align single local demo corpus'
          git push
